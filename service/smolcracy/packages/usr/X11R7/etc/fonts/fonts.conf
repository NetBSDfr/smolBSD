<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig for the X11R7 copy linked by urxvt/i3/rofi:
     it cannot parse the pkgsrc /usr/pkg/etc/fonts/fonts.conf, so keep
     this one tiny and let it be the only config anyone uses
     (FONTCONFIG_PATH in /etc/session.sh points both trees here). -->
<fontconfig>
	<dir>/usr/pkg/share/fonts</dir>
	<dir>/usr/X11R7/lib/X11/fonts</dir>
	<cachedir>~/.cache/fontconfig</cachedir>
	<alias binding="same"><family>monospace</family>
		<prefer><family>JetBrainsMono Nerd Font Mono</family></prefer></alias>
	<alias binding="same"><family>sans-serif</family>
		<prefer><family>Inter</family></prefer></alias>
</fontconfig>
