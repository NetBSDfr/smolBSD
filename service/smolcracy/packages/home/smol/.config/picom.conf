# smolcracy picom — soft shadows over the dark theme. xrender backend:
# glx over virgl (Mesa 21.3.7) freezes presentation after minutes;
# xrender is stable.
#
# Corners are SQUARE on purpose (corner-radius = 0).  Rounded corners
# clip i3's pixel border at the corners, leaving the arc with no border
# color.  Drawing the border along the rounded arc exists only in the
# glx backend's shader (and it samples the *client* window's own border
# pixels, which i3's reparented pixel border does not have).  xrender
# cannot draw rounded borders and upstream won't (yshui/picom#683), so
# square corners are the only way to keep the accent border intact.
backend = "xrender"
corner-radius = 0
fade = true
fade-in-step = 0.05
fade-out-step = 0.05
shadow = true
shadow-radius = 16
shadow-opacity = 0.5
shadow-offset-x = -8
shadow-offset-y = -8
shadow-exclude = [
	"window_type = 'dock'",
];
