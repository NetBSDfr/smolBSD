# smolcracy picom — the Hyprland-ish look: big rounded corners and
# soft shadows over the dark theme. xrender backend: glx over virgl
# (Mesa 21.3.7) freezes presentation after minutes; xrender is stable.
backend = "xrender"
corner-radius = 12
rounded-corners-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'",
];
fade = true
fade-in-step = 0.05
fade-out-step = 0.05
shadow = true
shadow-radius = 16
shadow-opacity = 0.5
shadow-offset-x = -8
shadow-offset-y = -8
shadow-exclude = [
	"window_type = 'dock'",
];
