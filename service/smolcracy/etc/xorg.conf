Section "Module"
Load "dri"
Load "dri2"
EndSection
Section "ServerFlags"
	Option "DisableVT" "true"
	Option "AutoAddDevices" "false"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
	Option "DPMS" "false"
EndSection
Section "Device"
	Identifier "v"
	Driver     "modesetting"
	# No glamor: with the compositor on, glamor reads the shared
	# virgl texture for every window redraw; Mesa (virtio_gpu, 21.3)
	# lazily flushes the virgl command ring, so the server can sample
	# a pixmap that is allocated-but-not-yet-drawn -> GL windows flash
	# black every other composited frame (glxgears).  With the fb
	# (RAM) pixmap the server's read is X-ordered and race-free; GL
	# clients keep virgl on the client side.  Cost: software X drawing
	# (fine at 1280x800 with picom xrender).
	Option     "AccelMethod" "none"
	# virtio-drm has no vblank source: without GLXVBlank off, the DDX
	# blocks in a 600s vblank-wait loop around every GLX swap and
	# stops polling input fds (the "X wedge" bug).
	Option     "GLXVBlank" "false"
	Option     "PageFlip" "false"
	Option     "SWCursor" "true"
EndSection
Section "Screen"
	Identifier "s"
	Device     "v"
EndSection
# Static core kbd/mouse; AutoAddDevices stays off (hotplug-on disables
# the static kbd0 device and the auto console keyboard's
# WSKBDIO_SETMODE on ttyE0 is a FatalError: the console is com, not our
# wskbd).  kbd Protocol "wskbd" opens /dev/wskbd0 (the real char 48
# device, unmuxed on open) — /dev/wskbd is a wsmux node and GTYPE fails
# there.  Mouse uses the wscons 'ws' driver on /dev/wsmouse (wsmux0,
# served by the WSMOUSEIO_GTYPE passthrough kernel patch).
Section "InputDevice"
	Identifier "kbd0"
	Driver     "kbd"
	Option     "Protocol" "wskbd"
	Option     "Device"   "/dev/wskbd0"
EndSection
Section "InputDevice"
	Identifier "mouse0"
	Driver     "ws"
	Option     "Device"   "/dev/wsmouse"
EndSection
Section "ServerLayout"
	Identifier  "l"
	Screen      "s"
	InputDevice "kbd0"   "CoreKeyboard"
	InputDevice "mouse0" "CorePointer"
EndSection
