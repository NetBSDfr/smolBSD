name: Build smolBSD image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'www/**'
      - 'app/**'
      - '.github/workflows/smoler.yml'
      - '.github/workflows/release-watch.yml'
      - 'smolerfiles/*'
  workflow_dispatch:
    inputs:
      img:
        description: "Image target"
        required: true
        default: "base"
      arch:
        description: "Architecture"
        required: true
        default: "amd64"
      service:
        description: "Service to build on top of image"
        required: false
        default: "build"
      mountro:
        description: "Build as read-only (y or empty)"
        required: false
        default: "y"
      curlsh:
        description: "URL to a script to execute as finalizer"
        required: false
        default:

jobs:
  build_img:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # base images are arch-independent (sets + newfs, no kernel baked in),
      # so aarch64 can be cross-built from the amd64 guest
      - name: Build images in a NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: "11"
          prepare: |
            /usr/sbin/pkg_add -u curl
          run: |
            cd $GITHUB_WORKSPACE
            for arch in amd64 evbarm-aarch64
            do
              make SERVICE=${{ inputs.service || 'build' }} CURLSH=${{ inputs.curlsh }} ARCH=$arch MOUNTRO=${{ inputs.mountro || 'y' }} ${{ inputs.img || 'base' }}
              # always build a small rescue image for debugging purposes
              make SERVICE=rescue ARCH=$arch base
            done

      - name: Compress images
        run: |
          sudo apt-get update && sudo apt-get install -y xz-utils
          cd images
          for f in *.img; do
            echo "Compressing $f..."
            xz -T0 -9e "$f"
            sha256sum ${f}.xz > ${f}.xz.sha256
          done
          rm -f *.img

      - name: Publish images to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest smolBSD images (compressed)"
          files: |
            images/*.img.xz
            images/*.xz.sha256
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
